# Edge proxy examples for multi-app VPS (ports 80/443 already taken).
# Prerequisites:
#   - aidesign-nginx joins PROXY_NETWORK (e.g. syncquote_syncquote)
#   - DNS A: aidesign.faizanmalik.me → this VPS

# ---------- Caddy (SyncQuote-style) ----------
# Add this site block to the SyncQuote Caddyfile, then reload Caddy.
# Caddy will obtain TLS automatically.

# aidesign.faizanmalik.me {
#     encode gzip
#     reverse_proxy aidesign-nginx:80
# }

# ---------- nginx (if edge is nginx instead) ----------
# HTTP → HTTPS + ACME
server {
    listen 80;
    listen [::]:80;
    server_name aidesign.faizanmalik.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aidesign.faizanmalik.me;

    ssl_certificate     /etc/letsencrypt/live/aidesign.faizanmalik.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aidesign.faizanmalik.me/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://aidesign-nginx:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
